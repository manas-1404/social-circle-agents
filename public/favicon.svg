<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3b0764"/>
      <stop offset="50%"  stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#86198f"/>
    </linearGradient>
    <linearGradient id="line" x1="9" y1="8" x2="23" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- Subtle radial glow in center -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <rect width="32" height="32" rx="7.5" fill="url(#glow)"/>

  <!-- S-curve conversation path connecting the two nodes -->
  <path
    d="M9 11.5 C9 17 23 15 23 20.5"
    stroke="url(#line)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Top-left node — the human (solid, brighter) -->
  <circle cx="9" cy="8.5" r="3.2" fill="white" filter="url(#soft)"/>

  <!-- Bottom-right node — the AI shape (slightly translucent, with a sparkle ring) -->
  <circle cx="23" cy="23.5" r="3.2" fill="white" opacity="0.88" filter="url(#soft)"/>
  <!-- Ring around shape node — suggests "agent / personality halo" -->
  <circle cx="23" cy="23.5" r="5.2" stroke="white" stroke-width="0.9" opacity="0.2"/>

  <!-- Two tiny message dots floating along the path -->
  <circle cx="13.5" cy="14.2" r="1.1" fill="white" opacity="0.38"/>
  <circle cx="18.5" cy="17.8" r="1.1" fill="white" opacity="0.38"/>
</svg>
